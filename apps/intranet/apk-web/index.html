<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Intelli Viajes</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #f8fafc 0%, #ecfeff 100%);
        color: #0f172a;
      }
      .card {
        max-width: 520px;
        margin: 24px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0; line-height: 1.5; color: #334155; }
      code { background: #f1f5f9; padding: 2px 6px; border-radius: 8px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Intelli Viajes APK</h1>
      <p>
        APK generado correctamente. Si quieres cargar la web remota dentro de la app,
        define <code>CAPACITOR_SERVER_URL</code> y vuelve a compilar.
      </p>
    </div>
  </body>
  </html>
